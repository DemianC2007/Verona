<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sitio en mantenimiento · Calleros &amp; Co</title>
<meta name="description" content="Este sitio está en mantenimiento. Desarrollado por Calleros &amp; Co.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 90 90'%3E%3Crect width='90' height='90' rx='18' fill='%231A334A'/%3E%3Cpath d='M 61 20 A 30 30 0 1 0 61 70' stroke='%2327E6EC' stroke-width='16' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1A334A; --teal-dark: #1E536E; --teal: #18A3B7;
    --cyan: #27E6EC; --blue: #5AA5CD; --ink: #0B1929;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    background: radial-gradient(ellipse at 20% 0%, var(--teal-dark) 0%, var(--navy) 45%, var(--ink) 100%);
    color: #fff; font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  header { padding: 28px 24px; }
  header svg { height: 44px; width: auto; display: block; }
  main {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    max-width: 720px; margin: 0 auto; padding: 24px 24px 64px; width: 100%;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 10px; align-self: flex-start;
    padding: 8px 14px; border: 1px solid rgba(39,230,236,.35); border-radius: 999px;
    color: var(--cyan); font-size: 13px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  h1 {
    font-family: Syne, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 800;
    font-size: clamp(36px, 7vw, 64px); line-height: 1.05; margin: 24px 0 20px;
  }
  h1 span { color: var(--cyan); }
  p { font-size: 18px; line-height: 1.6; color: rgba(255,255,255,.75); font-weight: 300; max-width: 560px; }
  .bar { height: 4px; border-radius: 4px; background: rgba(255,255,255,.08); margin: 36px 0; max-width: 360px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, var(--teal), var(--cyan)); border-radius: 4px; animation: slide 2.4s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  .cta {
    display: inline-block; align-self: flex-start; padding: 14px 22px; border-radius: 10px;
    background: var(--cyan); color: var(--ink); font-weight: 600; text-decoration: none; font-size: 15px;
  }
  .cta:hover { background: #fff; }
  footer { padding: 24px; text-align: center; font-size: 13px; color: rgba(255,255,255,.5); }
  footer a { color: var(--blue); text-decoration: none; }
  footer a:hover { color: var(--cyan); }
  @media (prefers-reduced-motion: reduce) { .dot, .bar i { animation: none; } }
</style>
</head>
<body>
  <header>
    <a href="https://calleros.me" aria-label="Calleros &amp; Co">
      <svg viewBox="0 0 300 90" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
        <path d="M 61 20 A 30 30 0 1 0 61 70" stroke="#27E6EC" stroke-width="16" stroke-linecap="butt"/>
        <line x1="97" y1="22" x2="97" y2="68" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.2"/>
        <text x="112" y="47" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="2" fill="#FFFFFF">CALLEROS</text>
        <text x="112" y="65" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="300" letter-spacing="7" fill="rgba(255,255,255,0.55)">&amp; CO</text>
      </svg>
    </a>
  </header>
  <main>
    <div class="badge"><span class="dot"></span>En mantenimiento</div>
    <h1>Estamos trabajando <span>en este sitio.</span></h1>
    <p>Este sitio está en mantenimiento y en construcción por el momento. Muy pronto volverá a estar disponible.</p>
    <div class="bar"><i></i></div>
    <a class="cta" href="https://calleros.me">Conoce Calleros &amp; Co</a>
  </main>
  <footer>Desarrollado por <a href="https://calleros.me">calleros.me</a></footer>
</body>
</html>
